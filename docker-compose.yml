services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swing-trading-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PRICE_REFRESH_INTERVAL=${PRICE_REFRESH_INTERVAL:-300}
      - DATABASE_PATH=/app/data/swing_trades.db
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - swing-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swing-trading-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swing-network

networks:
  swing-network:
    driver: bridge
